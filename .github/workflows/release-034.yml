name: Publish approved 0.3.4 release

# One-time fallback for the owner's approved release when the local Git
# credential helper is unavailable. No other branch or version can publish.
on:
  push:
    branches: [release/0.3.4]

permissions:
  contents: write

concurrency:
  group: approved-release-0.3.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved version and test addon
        run: |
          python -c "from pathlib import Path; assert '## Version: 0.3.4\n' in Path('PriestShieldTracker.toc').read_text()"
          python -m pip install -r requirements-dev.txt
          python tests/check.py
      - name: Build verified release package and notes
        run: |
          python scripts/package.py --tag v0.3.4
          python -c "from pathlib import Path; import re; text=Path('CHANGELOG.md').read_text(); notes=re.split(r'^## ', text, flags=re.M)[1].split('\n',1)[1].strip(); Path('dist/release-notes.md').write_text(notes+'\n')"
      - name: Push approved release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(git ls-remote --tags origin refs/tags/v0.3.4 | cut -f1)
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA" || { echo 'Published tag points elsewhere; refusing to move it.'; exit 1; }
          else
            git -c tag.gpgSign=false tag v0.3.4 "$GITHUB_SHA"
            git push origin refs/tags/v0.3.4
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.3.4 >/dev/null 2>&1; then
            gh release upload v0.3.4 dist/PriestShieldTracker-0.3.4.zip --clobber
            gh release edit v0.3.4 --title 'PriestShieldTracker 0.3.4' --notes-file dist/release-notes.md
          else
            gh release create v0.3.4 dist/PriestShieldTracker-0.3.4.zip --verify-tag --title 'PriestShieldTracker 0.3.4' --notes-file dist/release-notes.md
          fi
