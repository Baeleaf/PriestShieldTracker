name: Publish addon release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v0.3.0

concurrency:
  group: addon-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check addon logic
        run: |
          python -m pip install -r requirements-dev.txt
          python tests/check.py
      - name: Build and verify installable ZIP
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: python
        run: |
          import os
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          from scripts.package import package
          version, output = package(os.environ['RELEASE_TAG'])
          notes = Path('dist/release-notes.md')
          notes.write_text(re.split(r'^## ', Path('CHANGELOG.md').read_text(), flags=re.M)[1].split('\n', 1)[1].strip() + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'version={version}\nasset={output}\nnotes={notes}\n')
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          ASSET: ${{ steps.package.outputs.asset }}
          NOTES: ${{ steps.package.outputs.notes }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$ASSET" --clobber
            gh release edit "v$VERSION" --title "SoulShield $VERSION" --notes-file "$NOTES"
          elif [[ "$VERSION" == *-alpha.* || "$VERSION" == *-beta.* ]]; then
            gh release create "v$VERSION" "$ASSET" --verify-tag --prerelease --title "SoulShield $VERSION" --notes-file "$NOTES"
          else
            gh release create "v$VERSION" "$ASSET" --verify-tag --title "SoulShield $VERSION" --notes-file "$NOTES"
          fi
